<div class="video-background">
    <div class="video-foreground">
        <video autoplay muted loop src="https://videos.pexels.com/video-files/7985887/7985887-uhd_2732_1440_25fps.mp4" frameborder="0" allowfullscreen></video>
    </div>
    <div class="overlay"></div>
</div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Movie Reviews</h2>
    <p class="text-center">Read what our community thinks about these movies</p>

    <!-- Dynamic Reviews Section -->
    <div class="row justify-content-center" id="reviewsSection">
        <!-- Dynamic review content will be loaded here by ReviewService -->
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading reviews...</span>
            </div>
            <p class="mt-2">Loading movie reviews...</p>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    console.log("Reviews page loaded, initializing ReviewService...");
    
    // Initialize ReviewService when the reviews page loads
    if (typeof ReviewService !== 'undefined') {
        ReviewService.init();
    } else {
        console.error("ReviewService not found!");
    }
});
</script>
