<div class="video-background">
    <div class="video-foreground">
        <video autoplay muted loop src="https://videos.pexels.com/video-files/3134589/3134589-uhd_2560_1440_24fps.mp4" frameborder="0" allowfullscreen></video>
    </div>
    <div class="overlay"></div>
</div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Movies</h2>
    <p class="text-center">Explore recommended movies here.</p>
    
    <!-- Search and Filter Controls -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="input-group">
                <input type="text" class="form-control" id="movieSearch" placeholder="Search movies...">
                <button class="btn btn-outline-secondary" type="button" onclick="MovieService.searchMovies($('#movieSearch').val())">
                    Search
                </button>
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="genreFilter" onchange="MovieService.filterByGenre(this.value)">
                <option value="">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="yearFilter" onchange="MovieService.filterByYear(this.value)">
                <option value="">All Years</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="1999">1999</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-secondary w-100" onclick="MovieService.loadMovies()">Reset</button>
        </div>
    </div>

    <!-- Movies Section (Dynamic Content from Database) -->
    <div class="row justify-content-center" id="moviesSection">
        <!-- Dynamic movie content will be loaded here by MovieService -->
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading movies...</span>
            </div>
            <p class="mt-2">Loading movies from database...</p>
        </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal fade" id="addMovieModal" tabindex="-1" aria-labelledby="addMovieModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="addMovieForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addMovieModalLabel">Add New Movie</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group mb-3">
                            <label for="add-title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="add-title" name="title" required 
                                   placeholder="Enter movie title (e.g., The Matrix)">
                        </div>
                        <div class="form-group mb-3">
                            <label for="add-description" class="form-label">Description:</label>
                            <textarea class="form-control" id="add-description" name="description" rows="3" required 
                                      placeholder="Enter movie description..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="add-genre" class="form-label">Genre:</label>
                                    <select class="form-control" id="add-genre" name="genre" required>
                                        <option value="">Select Genre</option>
                                        <option value="Action">Action</option>
                                        <option value="Comedy">Comedy</option>
                                        <option value="Drama">Drama</option>
                                        <option value="Horror">Horror</option>
                                        <option value="Sci-Fi">Sci-Fi</option>
                                        <option value="Thriller">Thriller</option>
                                        <option value="Romance">Romance</option>
                                        <option value="Adventure">Adventure</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="add-release_year" class="form-label">Release Year:</label>
                                    <input type="number" class="form-control" id="add-release_year" name="release_year" 
                                           min="1888" max="2030" required placeholder="e.g., 2023">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="add-rating" class="form-label">Rating (0-10):</label>
                                    <input type="number" class="form-control" id="add-rating" name="rating" 
                                           min="0" max="10" step="0.1" required placeholder="e.g., 8.5">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="add-image_url" class="form-label">Image URL (optional):</label>
                                    <input type="text" class="form-control" id="add-image_url" name="image_url" 
                                           placeholder="https://example.com/image.jpg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Add Movie</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Movie Modal -->
    <div class="modal fade" id="editMovieModal" tabindex="-1" aria-labelledby="editMovieModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="editMovieForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editMovieModalLabel">Edit Movie</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="id">
                        <div class="form-group mb-3">
                            <label for="edit-title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="edit-title" name="title" required
                                   placeholder="Enter movie title (e.g., The Matrix)">
                        </div>
                        <div class="form-group mb-3">
                            <label for="edit-description" class="form-label">Description:</label>
                            <textarea class="form-control" id="edit-description" name="description" rows="3" required
                                      placeholder="Enter movie description..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="edit-genre" class="form-label">Genre:</label>
                                    <select class="form-control" id="edit-genre" name="genre" required>
                                        <option value="">Select Genre</option>
                                        <option value="Action">Action</option>
                                        <option value="Comedy">Comedy</option>
                                        <option value="Drama">Drama</option>
                                        <option value="Horror">Horror</option>
                                        <option value="Sci-Fi">Sci-Fi</option>
                                        <option value="Thriller">Thriller</option>
                                        <option value="Romance">Romance</option>
                                        <option value="Adventure">Adventure</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="edit-release_year" class="form-label">Release Year:</label>
                                    <input type="number" class="form-control" id="edit-release_year" name="release_year" 
                                           min="1888" max="2030" required placeholder="e.g., 2023">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="edit-rating" class="form-label">Rating (0-10):</label>
                                    <input type="number" class="form-control" id="edit-rating" name="rating" 
                                           min="0" max="10" step="0.1" required placeholder="e.g., 8.5">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="edit-image_url" class="form-label">Image URL (optional):</label>
                                    <input type="text" class="form-control" id="edit-image_url" name="image_url" 
                                           placeholder="https://example.com/image.jpg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal fade" id="movieDetailsModal" tabindex="-1" aria-labelledby="movieDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="movieDetailsModalLabel">Movie Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Dynamic content will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Movie Modal -->
    <div class="modal fade" id="deleteMovieModal" tabindex="-1" aria-labelledby="deleteMovieModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteMovieModalLabel">Delete Movie</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="delete-movie-body">
                    <!-- Dynamic content will be inserted here -->
                </div>
                <div class="modal-footer">
                    <input id="delete_movie_id" name="id" type="hidden" />
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" onclick="MovieService.deleteMovie()" class="btn btn-danger">Delete Movie</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    console.log("Movies page loaded, initializing MovieService...");
    
    // Initialize MovieService when the movies page loads
    if (typeof MovieService !== 'undefined') {
        MovieService.init();
    } else {
        console.error("MovieService not found!");
    }
    
    // Search on Enter key
    $(document).on('keypress', '#movieSearch', function(e) {
        if (e.which === 13) {
            MovieService.searchMovies($(this).val());
        }
    });
});
</script>
