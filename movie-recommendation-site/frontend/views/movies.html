<div class="video-background">
    <div class="video-foreground">
        <video autoplay muted loop src="https://videos.pexels.com/video-files/3134589/3134589-uhd_2560_1440_24fps.mp4" frameborder="0" allowfullscreen></video>
    </div>
    <div class="overlay"></div>
</div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Movies</h2>
    <p class="text-center">Explore recommended movies here.</p>
    
    <!-- Search and Filter Controls -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="input-group">
                <input type="text" class="form-control" id="movieSearch" placeholder="Search movies...">
                <button class="btn btn-outline-secondary" type="button" onclick="MovieService.searchMovies($('#movieSearch').val())">
                    Search
                </button>
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="genreFilter" onchange="MovieService.filterByGenre(this.value)">
                <option value="">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="yearFilter" onchange="MovieService.filterByYear(this.value)">
                <option value="">All Years</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="1999">1999</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-secondary w-100" onclick="MovieService.loadMovies()">Reset</button>
        </div>
    </div>

    <!-- Movies Section (Dynamic Content from Database) -->
    <div class="row justify-content-center" id="moviesSection">
        <!-- Dynamic movie content will be loaded here by MovieService -->
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading movies...</span>
            </div>
            <p class="mt-2">Loading movies from database...</p>
        </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal" id="addMovieModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="addMovieForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Movie</h5>
                    </div>
                    <div class="modal-body">
                        <div class="form-group mb-3">
                            <label for="title">Title:</label>
                            <input type="text" class="form-control" name="title" required 
                                   placeholder="Enter movie title (e.g., The Matrix)">
                        </div>
                        <div class="form-group mb-3">
                            <label for="description">Description:</label>
                            <textarea class="form-control" name="description" rows="3" required 
                                      placeholder="Enter movie description..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="genre">Genre:</label>
                                    <select class="form-control" name="genre" required>
                                        <option value="">Select Genre</option>
                                        <option value="Action">Action</option>
                                        <option value="Comedy">Comedy</option>
                                        <option value="Drama">Drama</option>
                                        <option value="Horror">Horror</option>
                                        <option value="Sci-Fi">Sci-Fi</option>
                                        <option value="Thriller">Thriller</option>
                                        <option value="Romance">Romance</option>
                                        <option value="Adventure">Adventure</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="release_year">Release Year:</label>
                                    <input type="number" class="form-control" name="release_year" min="1888" max="2030" required
                                           placeholder="e.g., 2023">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="rating">Rating (0-10):</label>
                                    <input type="number" class="form-control" name="rating" min="0" max="10" step="0.1" required
                                           placeholder="e.g., 8.5">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="image_url">Image URL (optional):</label>
                                    <input type="text" class="form-control" name="image_url" 
                                           placeholder="https://example.com/image.jpg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="MovieService.closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-success">Add Movie</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Movie Modal -->
    <div class="modal" id="editMovieModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="editMovieForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Movie</h5>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="id">
                        <div class="form-group mb-3">
                            <label for="title">Title:</label>
                            <input type="text" class="form-control" name="title" required
                                   placeholder="Enter movie title (e.g., The Matrix)">
                        </div>
                        <div class="form-group mb-3">
                            <label for="description">Description:</label>
                            <textarea class="form-control" name="description" rows="3" required
                                      placeholder="Enter movie description..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="genre">Genre:</label>
                                    <select class="form-control" name="genre" required>
                                        <option value="">Select Genre</option>
                                        <option value="Action">Action</option>
                                        <option value="Comedy">Comedy</option>
                                        <option value="Drama">Drama</option>
                                        <option value="Horror">Horror</option>
                                        <option value="Sci-Fi">Sci-Fi</option>
                                        <option value="Thriller">Thriller</option>
                                        <option value="Romance">Romance</option>
                                        <option value="Adventure">Adventure</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="release_year">Release Year:</label>
                                    <input type="number" class="form-control" name="release_year" min="1888" max="2030" required
                                           placeholder="e.g., 2023">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="rating">Rating (0-10):</label>
                                    <input type="number" class="form-control" name="rating" min="0" max="10" step="0.1" required
                                           placeholder="e.g., 8.5">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="image_url">Image URL (optional):</label>
                                    <input type="text" class="form-control" name="image_url" 
                                           placeholder="https://example.com/image.jpg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="MovieService.closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Movie Modal -->
    <div class="modal fade" id="deleteMovieModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Movie</h5>
                </div>
                <input id="delete_movie_id" name="id" hidden />
                <div class="modal-body" id="delete-movie-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="MovieService.closeModal()">Cancel</button>
                    <button type="button" onclick="MovieService.deleteMovie()" class="btn btn-danger">Delete Movie</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
$(document).ready(function() {
    // Initialize MovieService when the movies page loads
    console.log("Movies page loaded, initializing MovieService...");
    
    // Small delay to ensure all scripts are loaded
    setTimeout(function() {
        if (typeof MovieService !== 'undefined') {
            MovieService.init();
        } else {
            console.error("MovieService not found!");
        }
    }, 500);
    
    // Search on Enter key
    $(document).on('keypress', '#movieSearch', function(e) {
        if (e.which === 13) {
            MovieService.searchMovies($(this).val());
        }
    });
});
</script>
