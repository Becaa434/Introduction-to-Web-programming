<div class="video-background">
    <div class="video-foreground">
        <video autoplay muted loop src="https://videos.pexels.com/video-files/7985887/7985887-uhd_2732_1440_25fps.mp4" frameborder="0" allowfullscreen></video>
    </div>
    <div class="overlay"></div>
</div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Recommended for You</h2>
    <p class="text-center">Explore movies recommended by our experts.</p>

    <!-- Dynamic Recommendations Section -->
    <div class="row justify-content-center" id="recommendationsSection">
        <!-- Dynamic recommendation content will be loaded here by RecommendationService -->
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading recommendations...</span>
            </div>
            <p class="mt-2">Loading recommended movies...</p>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    console.log("Recommendations page loaded, initializing RecommendationService...");
    
    // Initialize RecommendationService when the recommendations page loads
    if (typeof RecommendationService !== 'undefined') {
        RecommendationService.init();
    } else {
        console.error("RecommendationService not found!");
    }
});
</script>
